# Identificador único do projeto criado no SonarQube
sonar.projectKey=Onboardly

# Metadados opcionais
sonar.projectName=Onboardly
sonar.projectVersion=1.0

# Diretório contendo o código-fonte (padrão é o diretório atual ou src)
sonar.sources=frontend, backend

# Endereço do servidor SonarQube
sonar.host.url=http://localhost:9000

# Token de autenticação gerado no SonarQube
# Configure via variável de ambiente SONAR_TOKEN ou passe via CLI: -Dsonar.token=YOUR_TOKEN
# sonar.token=
